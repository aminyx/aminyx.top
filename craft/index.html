<main class="craft container" id="main">
  <p class="eyebrow" data-i18n="craft.tag">Лаборатория</p>
  <h1 class="craft-h1">Craft</h1>
  <p class="craft-lead" data-i18n="craft.lead">Механики из реальной инженерии — не видео и не картинки: каждую можно потрогать. Это те же принципы, на которых построены Aminyx Link и SomonVPN.</p>

  <div class="craft-grid">
    <figure class="craft-card" data-vignette="failover">
      <canvas tabindex="0" role="application" aria-labelledby="ct-failover" aria-describedby="cd-failover"></canvas>
      <figcaption>
        <span class="craft-idx" aria-hidden="true">01</span>
        <h2 id="ct-failover" data-i18n="craft.v1t">Multipath failover</h2>
        <p id="cd-failover" data-i18n="craft.v1p">Клик по активному пути обрывает его. Смотрите, как трафик мгновенно перетекает на резервный маршрут.</p>
      </figcaption>
    </figure>

    <figure class="craft-card" data-vignette="fec">
      <canvas tabindex="0" role="application" aria-labelledby="ct-fec" aria-describedby="cd-fec"></canvas>
      <figcaption>
        <span class="craft-idx" aria-hidden="true">02</span>
        <h2 id="ct-fec" data-i18n="craft.v2t">Reed-Solomon FEC</h2>
        <p id="cd-fec" data-i18n="craft.v2p">Кликами выбивайте блоки в полёте. Пока потерь не больше числа парити-блоков — данные восстанавливаются без ретрансляции.</p>
      </figcaption>
    </figure>

    <figure class="craft-card" data-vignette="congestion">
      <canvas tabindex="0" role="application" aria-labelledby="ct-congestion" aria-describedby="cd-congestion"></canvas>
      <figcaption>
        <span class="craft-idx" aria-hidden="true">03</span>
        <h2 id="ct-congestion" data-i18n="craft.v3t">Congestion control</h2>
        <p id="cd-congestion" data-i18n="craft.v3p">Клик — потеря пакета. Сравните, как Reno, CUBIC и BBR восстанавливают окно после сбоя.</p>
      </figcaption>
    </figure>

    <figure class="craft-card" data-vignette="killswitch">
      <canvas tabindex="0" role="application" aria-labelledby="ct-killswitch" aria-describedby="cd-killswitch"></canvas>
      <figcaption>
        <span class="craft-idx" aria-hidden="true">04</span>
        <h2 id="ct-killswitch" data-i18n="craft.v4t">Kill switch</h2>
        <p id="cd-killswitch" data-i18n="craft.v4p">Клик обрывает VPN-туннель. Заслонка закрывается быстрее, чем уходит первый пакет: утечек — ноль.</p>
      </figcaption>
    </figure>

    <figure class="craft-card craft-card-type" data-vignette="type">
      <div class="type-lab">
        <p class="type-sample" id="type-sample" contenteditable="true" spellcheck="false" role="textbox" aria-label="Образец текста" data-i18n-aria="craft.a11ySample">Aminyx</p>
        <label class="type-ctl">
          <span class="craft-idx">wght</span>
          <input id="type-wght" type="range" min="100" max="900" step="1" value="800" aria-label="Вес шрифта" data-i18n-aria="craft.a11yWght">
          <output id="type-out" for="type-wght">800</output>
        </label>
      </div>
      <figcaption>
        <span class="craft-idx" aria-hidden="true">05</span>
        <h2 data-i18n="craft.v5t">Вариативная ось</h2>
        <p data-i18n="craft.v5p">Onest от 100 до 900 из одного файла. Текст редактируемый — попробуйте своё слово.</p>
      </figcaption>
    </figure>
  </div>

  <p class="craft-foot"><a class="link-out" href="/"><span data-i18n="craft.back">← На главную</span></a></p>
